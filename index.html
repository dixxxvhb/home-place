<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#a9bccd" />
  <title>Saturday Morning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="veil"></div>

  <section id="intro" aria-live="polite">
    <div class="intro-inner">
      <h1>Saturday morning</h1>
      <p class="lede" id="status">Getting the place ready</p>
      <button id="enter" type="button" disabled>Walk in</button>
      <p class="hint" id="hint-desktop">W A S D to walk, mouse to look, Shift to hurry. Esc to stop.</p>
      <p class="hint" id="hint-touch">Left thumb to walk, right thumb to look.</p>
      <p class="hint quiet">Headphones on, if you have them.</p>
    </div>
  </section>

  <div id="stick" aria-hidden="true"><div id="stick-knob"></div></div>
  <div id="toast" role="status"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
